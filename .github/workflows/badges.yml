name: Star count

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/badges.yml

permissions:
  contents: write

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sum stars over public repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "users/${GITHUB_REPOSITORY_OWNER}/repos?per_page=100&type=owner" --paginate \
            | jq -s '[.[][] | select(.fork|not) | select(.visibility=="public") | .stargazers_count] | add // 0')
          printf '{"schemaVersion":1,"label":"STARS","message":"%s","color":"0a0a0a","labelColor":"020202"}\n' "$total" > stars.json

      - name: Commit if changed
        run: |
          git add stars.json
          git diff --staged --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update star count"
          git push
