<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="nzeronfourme: AI, automation, tools">
  <title>nzeronfourme</title>
  <desc>Terminal-style banner. nzeronfourme. AI, automation, tools. building apps and tools with ai agents.</desc>
  <defs>
    <clipPath id="hf-card">
      <rect x="0" y="0" width="1200" height="260" rx="14" ry="14"/>
    </clipPath>
    <pattern id="hf-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#f2f0ea" opacity="0.035"/>
    </pattern>
    <style>
      .hf-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <g clip-path="url(#hf-card)">
    <rect x="0" y="0" width="1200" height="260" fill="#0b0b0b"/>
    <rect x="0" y="0" width="1200" height="260" fill="url(#hf-scan)"/>

    <rect x="0" y="0" width="1200" height="40" fill="#101010"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <circle cx="28" cy="20" r="4.5" fill="#2a2a2a" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="46" cy="20" r="4.5" fill="#242424" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="64" cy="20" r="4.5" fill="#1e1e1e" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

    <text class="hf-mono" x="88" y="24.5" font-size="11" letter-spacing="1.4" fill="#f2f0ea" fill-opacity="0.52">~/nzeronfourme</text>
    <text class="hf-mono" x="1172" y="24.5" text-anchor="end" font-size="11" letter-spacing="1.4" fill="#f2f0ea" fill-opacity="0.40">main</text>

    <text class="hf-mono" x="56" y="138" font-size="60" font-weight="400" letter-spacing="-1.2" fill="#f2f0ea">nzeronfourme</text>
    <text class="hf-mono" x="56" y="181" font-size="20" letter-spacing="0.6" fill="#f2f0ea" fill-opacity="0.68">AI · automation · tools</text>

    <text class="hf-mono" x="56" y="215" font-size="16" textLength="384" lengthAdjust="spacing" fill="#f2f0ea" fill-opacity="0.52">&gt; building apps and tools with ai agents</text>
    <rect x="450" y="201" width="9" height="15" rx="1" fill="#f2f0ea" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.75;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" ry="14" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
</svg>
